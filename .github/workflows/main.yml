    // =========================================================
    // INFO PAGES
    // =========================================================

    private void showInfo(String section) {

        LinearLayout page = basePage();

        topBar(page, section, true);

        TextView title = text(
                section,
                28,
                WHITE,
                Typeface.BOLD
        );

        page.addView(title, lp(-1, -2, 20, 30, 20, 10));

        TextView info = text(
                getInfoText(section),
                15,
                MUTED,
                Typeface.NORMAL
        );

        info.setLineSpacing(6, 1.1f);

        page.addView(
                info,
                lp(-1, -2, 20, 0, 20, 25)
        );

        Button action = button(
                getActionText(section)
        );

        page.addView(
                action,
                lp(-1, 58, 20, 0, 20, 20)
        );

        setContentView(page);
    }

    private String getInfoText(String section) {

        if (section.equals("PLATFORMS")) {
            return "Manage your global platform connections and delivery status.\n\n"
                    + "Spotify\nApple Music\nYouTube Music\nAmazon Music\nDeezer\nTIDAL\nTikTok\nInstagram / Facebook\n\n"
                    + "Platform availability depends on distribution status and territory.";
        }

        if (section.equals("VIDEO & CLIPS")) {
            return "Video & Clips is a separate content workflow from ordinary music releases.\n\n"
                    + "Upload videos\nManage clips\nProcessing status\nVideo library\nVideo analytics\nDistribution status";
        }

        if (section.equals("RIGHTS")) {
            return "Manage the rights connected to your music.\n\n"
                    + "Master rights\nPublishing\nCopyright\nOwnership\nSplits\nDocuments\nContributor information";
        }

        if (section.equals("ROYALTIES")) {
            return "Track your music earnings across supported platforms.\n\n"
                    + "Total earnings\nAvailable balance\nPending earnings\nRelease earnings\nPlatform earnings\nStatements\nPayout history";
        }

        if (section.equals("DISTRIBUTION")) {
            return "Monitor the global distribution process.\n\n"
                    + "Submitted\nUnder review\nApproved\nDelivered\nLive\nChanges required\nRejected";
        }

        if (section.equals("AUDIENCE")) {
            return "Understand who listens to your music.\n\n"
                    + "Countries\nCities\nListeners\nDemographics\nAudience growth\nFans\nInsights";
        }

        if (section.equals("MARKETING")) {
            return "Build campaigns around your releases.\n\n"
                    + "Release promotion\nSocial strategy\nPlaylist strategy\nCampaign tracking\nInternational promotion";
        }

        if (section.equals("PROFILE & SETTINGS")) {
            return "Manage your artist account.\n\n"
                    + "Artist profile\nEmail\nPassword\nNotifications\nSecurity\nConnected accounts\nLogout";
        }

        if (section.equals("LEGAL & DOCUMENTS")) {
            return "Access important AVESON documents.\n\n"
                    + "Artist Agreement\nTerms of Service\nPrivacy Policy\nCopyright information\nRights information";
        }

        return "Welcome to AVESON Support.\n\n"
                + "Help Center\nFrequently Asked Questions\nContact Support\nSupport Tickets";
    }

    private String getActionText(String section) {

        if (section.equals("PLATFORMS"))
            return "MANAGE PLATFORMS";

        if (section.equals("VIDEO & CLIPS"))
            return "OPEN VIDEO WORKSPACE";

        if (section.equals("ROYALTIES"))
            return "VIEW ROYALTY STATEMENT";

        if (section.equals("DISTRIBUTION"))
            return "VIEW DISTRIBUTION";

        if (section.equals("SUPPORT"))
            return "CONTACT SUPPORT";

        return "OPEN WORKSPACE";
    }

    // =========================================================
    // TOP BAR
    // =========================================================

    private void topBar(
            LinearLayout page,
            String title,
            boolean back
    ) {

        LinearLayout bar = horizontal();

        if (back) {

            Button backButton = outlineButton("‹  BACK");

            bar.addView(
                    backButton,
                    new LinearLayout.LayoutParams(
                            105,
                            48
                    )
            );

            backButton.setOnClickListener(v -> showHome());
        }

        TextView titleText = text(
                title,
                17,
                WHITE,
                Typeface.BOLD
        );

        titleText.setGravity(Gravity.CENTER_VERTICAL);

        LinearLayout.LayoutParams titleParams =
                new LinearLayout.LayoutParams(
                        0,
                        48,
                        1
                );

        titleParams.leftMargin = 12;

        bar.addView(titleText, titleParams);

        page.addView(
                bar,
                lp(-1, 55, 15, 10, 15, 0)
        );
    }

    // =========================================================
    // BOTTOM NAV
    // =========================================================

    private View bottomNav(int selected) {

        LinearLayout nav = horizontal();

        nav.setGravity(Gravity.CENTER);
        nav.setPadding(8, 8, 8, 8);

        Button home = navButton("HOME");
        Button music = navButton("MUSIC");
        Button plus = navButton("+");
        Button analytics = navButton("ANALYTICS");
        Button more = navButton("MORE");

        nav.addView(
                home,
                new LinearLayout.LayoutParams(0, 60, 1)
        );

        nav.addView(
                music,
                new LinearLayout.LayoutParams(0, 60, 1)
        );

        nav.addView(
                plus,
                new LinearLayout.LayoutParams(0, 60, 1)
        );

        nav.addView(
                analytics,
                new LinearLayout.LayoutParams(0, 60, 1)
        );

        nav.addView(
                more,
                new LinearLayout.LayoutParams(0, 60, 1)
        );

        home.setOnClickListener(v -> showHome());
        music.setOnClickListener(v -> showMusic());
        plus.setOnClickListener(v -> showNewRelease());
        analytics.setOnClickListener(v -> showAnalytics());
        more.setOnClickListener(v -> showMore());

        return nav;
    }

    // =========================================================
    // UI HELPERS
    // =========================================================

    private LinearLayout basePage() {

        root = new LinearLayout(this);

        root.setOrientation(
                LinearLayout.VERTICAL
        );

        root.setBackgroundColor(BG);

        ScrollView scroll = new ScrollView(this);

        scroll.setFillViewport(true);

        content = new LinearLayout(this);

        content.setOrientation(
                LinearLayout.VERTICAL
        );

        scroll.addView(content);

        root.addView(
                scroll,
                new LinearLayout.LayoutParams(
                        -1,
                        0,
                        1
                )
        );

        return root;
    }

    private LinearLayout card() {

        LinearLayout c = new LinearLayout(this);

        c.setOrientation(
                LinearLayout.VERTICAL
        );

        c.setPadding(
                18,
                18,
                18,
                18
        );

        c.setBackground(
                rounded(PANEL, 22)
        );

        return c;
    }

    private LinearLayout horizontal() {

        LinearLayout l = new LinearLayout(this);

        l.setOrientation(
                LinearLayout.HORIZONTAL
        );

        return l;
    }

    private TextView text(
            String value,
            float size,
            int color,
            int style
    ) {

        TextView t = new TextView(this);

        t.setText(value);
        t.setTextSize(size);
        t.setTextColor(color);
        t.setTypeface(
                Typeface.DEFAULT,
                style
        );

        return t;
    }

    private TextView label(String value) {

        return text(
                value,
                11,
                PURPLE,
                Typeface.BOLD
        );
    }

    private TextView sectionTitle(String value) {

        return text(
                value,
                13,
                PURPLE,
                Typeface.BOLD
        );
    }

    private EditText edit(
            String title,
            String hint
    ) {

        EditText e = new EditText(this);

        e.setHint(title + "\n" + hint);
        e.setTextColor(WHITE);
        e.setHintTextColor(MUTED);
        e.setTextSize(14);
        e.setPadding(
                16,
                5,
                16,
                5
        );

        e.setBackground(
                rounded(PANEL2, 16)
        );

        return e;
    }

    private Button button(String value) {

        Button b = new Button(this);

        b.setText(value);
        b.setTextColor(WHITE);
        b.setTextSize(13);
        b.setTypeface(
                Typeface.DEFAULT,
                Typeface.BOLD
        );

        b.setAllCaps(false);

        b.setBackground(
                gradientButton()
        );

        return b;
    }

    private Button outlineButton(String value) {

        Button b = new Button(this);

        b.setText(value);
        b.setTextColor(WHITE);
        b.setTextSize(12);
        b.setTypeface(
                Typeface.DEFAULT,
                Typeface.BOLD
        );

        b.setAllCaps(false);

        b.setBackground(
                roundedStroke(PANEL2, PURPLE, 16)
        );

        return b;
    }

    private Button navButton(String value) {

        Button b = new Button(this);

        b.setText(value);
        b.setTextColor(MUTED);
        b.setTextSize(
                value.equals("+") ? 24 : 9
        );

        b.setAllCaps(false);
        b.setBackgroundColor(Color.TRANSPARENT);

        return b;
    }


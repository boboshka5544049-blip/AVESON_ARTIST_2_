package com.aveson.artist;

import android.app.*;import android.os.*;import android.content.*;import android.graphics.Color;import android.graphics.Typeface;import android.view.*;import android.widget.*;import java.util.*;

public class MainActivity extends Activity{
 int BG=Color.rgb(5,7,17),SUR=Color.rgb(16,20,38),SUR2=Color.rgb(21,26,48),PUR=Color.rgb(139,92,246),BLUE=Color.rgb(56,189,248),TXT=Color.rgb(248,250,252),MUT=Color.rgb(154,164,192),GR=Color.rgb(74,222,128); LinearLayout root;
 TextView t(String s,float z,int c){TextView v=new TextView(this);v.setText(s);v.setTextSize(z);v.setTextColor(c);return v;}
 GradientDrawable g(int c,int r){GradientDrawable x=new GradientDrawable();x.setColor(c);x.setCornerRadius(r);return x;}
 Button b(String s,int c){Button x=new Button(this);x.setText(s);x.setTextColor(TXT);x.setTextSize(13);x.setAllCaps(false);x.setTypeface(Typeface.DEFAULT,Typeface.BOLD);x.setBackground(g(c,55));return x;}
 EditText e(String h){EditText x=new EditText(this);x.setHint(h);x.setHintTextColor(MUT);x.setTextColor(TXT);x.setTextSize(16);x.setSingleLine(true);x.setPadding(18,0,18,0);x.setBackground(g(Color.rgb(13,17,34),55));x.setLayoutParams(new LinearLayout.LayoutParams(-1,58));return x;}
 LinearLayout col(){LinearLayout x=new LinearLayout(this);x.setOrientation(LinearLayout.VERTICAL);x.setPadding(24,20,24,24);x.setBackgroundColor(BG);return x;}
 TextView h(String s){TextView x=t(s,28,TXT);x.setTypeface(Typeface.DEFAULT,Typeface.BOLD);x.setPadding(0,8,0,10);return x;}
 TextView sub(String s){TextView x=t(s,15,MUT);x.setPadding(0,0,0,16);return x;}
 void base(LinearLayout p,boolean back){root=new LinearLayout(this);root.setOrientation(LinearLayout.VERTICAL);root.setBackgroundColor(BG);setContentView(root);if(back){LinearLayout bar=new LinearLayout(this);bar.setGravity(Gravity.CENTER_VERTICAL);TextView q=t("‹",40,TXT);q.setOnClickListener(v->home());bar.addView(q,new LinearLayout.LayoutParams(55,65));bar.addView(t("AVESON",20,TXT));root.addView(bar);}root.addView(p,new LinearLayout.LayoutParams(-1,0,1));}
 @Override public void onCreate(Bundle x){super.onCreate(x);home();}
 void login(){root=new LinearLayout(this);root.setOrientation(LinearLayout.VERTICAL);root.setPadding(34,40,34,24);root.setBackgroundColor(BG);setContentView(root);TextView l=t("AVESON",40,PUR);l.setTypeface(Typeface.DEFAULT,Typeface.BOLD);root.addView(l);TextView q=t("Your Music.\nYour Global Stage.",29,TXT);q.setTypeface(Typeface.DEFAULT,Typeface.BOLD);q.setPadding(0,24,0,8);root.addView(q);root.addView(sub("One powerful workspace for your music business."));Space sp=new Space(this);root.addView(sp,new LinearLayout.LayoutParams(1,80));EditText em=e("Email"),pw=e("Password");pw.setInputType(0x81);root.addView(em);root.addView(pw);Button s=b("SIGN IN  →",PUR);root.addView(s,new LinearLayout.LayoutParams(-1,60));Button c=b("CREATE ARTIST ACCOUNT",SUR2);root.addView(c,new LinearLayout.LayoutParams(-1,60));root.addView(sub("Secure • Global Distribution • Royalty Management"));s.setOnClickListener(v->{if(em.getText().toString().contains("@")&&pw.getText().length()>=6)home();else Toast.makeText(this,"Valid email and 6+ character password required",0).show();});}
 void home(){LinearLayout p=col();base(p,false);TextView l=t("AVESON  •  ARTIST",18,PUR);l.setTypeface(Typeface.DEFAULT,Typeface.BOLD);p.addView(l);TextView w=t("Welcome back 👋",30,TXT);w.setTypeface(Typeface.DEFAULT,Typeface.BOLD);w.setPadding(0,14,0,18);p.addView(w);card(p,"TOTAL STREAMS","128,540",GR);card(p,"EARNINGS","$1,284.60",BLUE);card(p,"ACTIVE RELEASES","0",BLUE);card(p,"TOP COUNTRY","Uzbekistan",BLUE);card(p,"RELEASE WORKFLOW","Submit music, check standards and track review.",GR);p.addView(t("Recent Activity",21,TXT));p.addView(sub("• Draft saved — Midnight\n• Royalty update — Statement ready\n• Audience — Growth this month"));nav(p,0);}
 void card(LinearLayout p,String a,String v,int c){LinearLayout x=new LinearLayout(this);x.setOrientation(LinearLayout.VERTICAL);x.setPadding(20,16,20,16);x.setBackground(g(SUR,36));LinearLayout.LayoutParams z=new LinearLayout.LayoutParams(-1,v.length()>20?132:108);z.setMargins(0,0,0,12);x.setLayoutParams(z);TextView q=t(a,13,MUT);q.setTypeface(Typeface.DEFAULT,Typeface.BOLD);x.addView(q);TextView r=t(v,27,TXT);r.setTypeface(Typeface.DEFAULT,Typeface.BOLD);x.addView(r);x.addView(t("OPEN →",13,c));p.addView(x);}
 void nav(LinearLayout p,int sel){Space s=new Space(this);p.addView(s,new LinearLayout.LayoutParams(1,0,1));LinearLayout n=new LinearLayout(this);n.setPadding(6,6,6,6);n.setBackground(g(Color.rgb(10,13,27),48));String[] a={"HOME","MUSIC","+","ANALYTICS","MORE"};for(int i=0;i<5;i++){final int k=i;Button x=b(a[i],i==sel?PUR:SUR2);x.setTextSize(i==2?22:11);n.addView(x,new LinearLayout.LayoutParams(0,58,1));x.setOnClickListener(v->{if(k==0)home();else if(k==1)music();else if(k==2)release();else if(k==3)analytics();else more();});}p.addView(n);}
 void music(){LinearLayout p=col();base(p,true);p.addView(h("Music"));p.addView(sub("All releases, drafts and delivery status."));Button n=b("+  NEW RELEASE",PUR);p.addView(n,new LinearLayout.LayoutParams(-1,58));n.setOnClickListener(v->release());item(p,"MIDNIGHT","Single • Draft");item(p,"NO SIGNAL","EP • Pending");item(p,"NEON HEART","Single • Released");nav(p,1);}
 void item(LinearLayout p,String a,String d){Button x=b(a+"\n"+d,SUR);x.setGravity(Gravity.LEFT|Gravity.CENTER_VERTICAL);p.addView(x,new LinearLayout.LayoutParams(-1,82));}
 void release(){LinearLayout p=col();base(p,true);p.addView(h("New Release"));p.addView(sub("Build your release and submit it for AVESON review."));p.addView(e("Release title"));p.addView(e("Primary artist"));p.addView(e("Featuring artist (optional)"));p.addView(e("Genre"));p.addView(e("Language"));LinearLayout dr=new LinearLayout(this);EditText date=e("Release date YYYY-MM-DD");dr.addView(date,new LinearLayout.LayoutParams(0,58,1));Button cal=b("📅",SUR2);dr.addView(cal,new LinearLayout.LayoutParams(64,58));p.addView(dr);p.addView(sub("Calendar or keyboard. Past dates are blocked."));cal.setOnClickListener(v->{Calendar c=Calendar.getInstance();DatePickerDialog d=new DatePickerDialog(this,(q,y,m,day)->date.setText(String.format(Locale.US,"%04d-%02d-%02d",y,m+1,day)),c.get(1),c.get(2),c.get(5));d.getDatePicker().setMinDate(System.currentTimeMillis()-1000);d.show();});Button au=b("🎵  SELECT AUDIO",SUR2);p.addView(au,new LinearLayout.LayoutParams(-1,58));Button co=b("🎨  SELECT COVER",SUR2);p.addView(co,new LinearLayout.LayoutParams(-1,58));au.setOnClickListener(v->pick("audio/*",10));co.setOnClickListener(v->pick("image/*",11));p.addView(e("Lyrics (optional)"));p.addView(e("Copyright / rights owner"));CheckBox ch=new CheckBox(this);ch.setText("Explicit content");ch.setTextColor(TXT);p.addView(ch);Button f=b("FINAL REVIEW  →",PUR);p.addView(f,new LinearLayout.LayoutParams(-1,60));f.setOnClickListener(v->Toast.makeText(this,"Release saved in AVESON ARTIST 2.0 prototype",1).show());nav(p,2);}
 void pick(String type,int code){Intent i=new Intent(Intent.ACTION_OPEN_DOCUMENT);i.addCategory(Intent.CATEGORY_OPENABLE);i.setType(type);startActivityForResult(i,code);}
 void analytics(){LinearLayout p=col();base(p,true);p.addView(h("Analytics"));p.addView(sub("Streams, listeners, countries, platforms and growth."));metric(p,"STREAMS","128,540");metric(p,"LISTENERS","42,810");metric(p,"FOLLOWERS","8,420");metric(p,"TOP PLATFORM","Spotify");metric(p,"TOP COUNTRY","Uzbekistan");p.addView(h("Growth"));p.addView(sub("Daily • Weekly • Monthly • Yearly\n▁▂▃▂▄▅▆▇█"));nav(p,3);}
 void metric(LinearLayout p,String a,String b){card(p,a,b,GR);}
 void more(){LinearLayout p=col();base(p,true);p.addView(h("More"));p.addView(sub("Your complete AVESON artist workspace."));String[][] x={{"PLATFORMS","DSP delivery and platform status"},{"VIDEO & CLIPS","Video upload and analytics"},{"AUDIO STANDARDS","AVESON audio requirements"},{"COVER STANDARDS","AVESON artwork requirements"},{"RIGHTS","Master, publishing, ownership and splits"},{"ROYALTIES","Earnings, statements and payouts"},{"DISTRIBUTION","Release delivery and territories"},{"AUDIENCE","Fans, countries and insights"},{"MARKETING","Campaigns and promotion"},{"PROFILE & SETTINGS","Account and security"},{"LEGAL & DOCUMENTS","Agreements and documents"},{"LANGUAGES","Language preferences"},{"SUPPORT","Help center and tickets"}};for(String[] a:x){Button z=b(a[0]+"\n"+a[1],SUR);z.setGravity(Gravity.LEFT|Gravity.CENTER_VERTICAL);p.addView(z,new LinearLayout.LayoutParams(-1,72));z.setOnClickListener(v->info(a[0]));}nav(p,4);}
 void info(String s){LinearLayout p=col();base(p,true);p.addView(h(s));String body="AVESON ARTIST 2.0 workspace module. Ready for backend integration.";if(s.equals("AUDIO STANDARDS"))body="WAV/FLAC • 24-bit preferred • 44.1/48 kHz • stereo\nNo clipping, distortion or corrupt files. Submit only music you own or are authorized to distribute.\nMetadata: title, version, artists, genre, language, date, explicit status, contributors, ISRC/UPC.";if(s.equals("COVER STANDARDS"))body="Square 1:1 • 3000×3000 or larger preferred • JPG/PNG • RGB.\nAvoid platform logos, QR codes, prices, ads, contact details, misleading text and low-quality screenshots.";if(s.equals("ROYALTIES"))body="Total • Available • Pending • Release earnings • Platform earnings • Statements • Payout history";if(s.equals("RIGHTS"))body="Master rights • Publishing • Copyright ownership • Splits • Songwriters • Contributors • Documents";if(s.equals("VIDEO & CLIPS"))body="Separate video workspace for video upload, clips, processing, library, analytics and distribution status.";TextView z=t(body,16,TXT);z.setPadding(0,20,0,20);p.addView(z);}
}

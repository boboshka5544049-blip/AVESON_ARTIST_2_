name: AVESON ARTIST 2.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract AVESON ARTIST 2.0
        run: |
          mkdir -p project

          unzip -o AVESON_ARTIST_2_0*.zip -d project

          echo "Finding Gradle project..."

          SETTINGS=$(find project -name settings.gradle -type f | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            find project -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Found project at:"
          echo "$PROJECT_DIR"

      - name: Add AndroidX Gradle Properties
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          echo "gradle.properties:"
          cat gradle.properties

      - name: Check Android Project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Project files:"
          find . -maxdepth 4 -type f | sort

          echo "Checking Gradle:"
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f gradle.properties

      - name: Build AVESON ARTIST 2.0
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Check APK
        run: |
          APK="${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AVESON-ARTIST-2.0-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk

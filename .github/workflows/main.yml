        );
        card.addView(name, lp(-1, 58, 0, 0, 0, 12));

        EditText email = edit(
                "Email",
                "artist@example.com"
        );
        card.addView(email, lp(-1, 58, 0, 0, 0, 12));

        EditText password = edit(
                "Password",
                "Minimum 6 characters"
        );
        password.setInputType(
                android.text.InputType.TYPE_CLASS_TEXT |
                android.text.InputType.TYPE_TEXT_VARIATION_PASSWORD
        );
        card.addView(password, lp(-1, 58, 0, 0, 0, 12));

        EditText confirm = edit(
                "Confirm password",
                "Repeat password"
        );
        confirm.setInputType(
                android.text.InputType.TYPE_CLASS_TEXT |
                android.text.InputType.TYPE_TEXT_VARIATION_PASSWORD
        );
        card.addView(confirm, lp(-1, 58, 0, 0, 0, 18));

        CheckBox terms = new CheckBox(this);
        terms.setText("I agree to the AVESON Artist Agreement");
        terms.setTextColor(MUTED);
        card.addView(terms, lp(-1, 55, 0, 0, 0, 10));

        Button create = button("CREATE ACCOUNT");
        card.addView(create, lp(-1, 58, 0, 0, 0, 0));

        create.setOnClickListener(v -> {

            if (name.getText().toString().trim().length() < 2) {
                name.setError("Enter artist name");
                return;
            }

            if (!email.getText().toString().contains("@")) {
                email.setError("Enter valid email");
                return;
            }

            if (password.getText().length() < 6) {
                password.setError("Password is too short");
                return;
            }

            if (!password.getText().toString()
                    .equals(confirm.getText().toString())) {
                confirm.setError("Passwords do not match");
                return;
            }

            if (!terms.isChecked()) {
                Toast.makeText(
                        this,
                        "Please accept the Artist Agreement",
                        Toast.LENGTH_SHORT
                ).show();
                return;
            }

            Toast.makeText(
                    this,
                    "Account created successfully",
                    Toast.LENGTH_LONG
            ).show();

            showLogin();
        });

        page.addView(card, lp(-1, -2, 20, 0, 20, 20));

        setContentView(page);
    }


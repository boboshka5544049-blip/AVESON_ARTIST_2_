    // APP START
    // ============================================================

    @Override
    protected void onCreate(Bundle savedInstanceState) {

        super.onCreate(savedInstanceState);

        login();
    }

    // ============================================================
    // LOGIN
    // ============================================================

    private void login() {

        root =
                new LinearLayout(this);

        root.setOrientation(
                LinearLayout.VERTICAL
        );

        root.setPadding(
                34,
                40,
                34,
                24
        );

        root.setBackgroundColor(BG);

        setContentView(root);

        // AVESON LOGO

        TextView logo =
                text(
                        "AVESON",
                        40,
                        PURPLE
                );

        logo.setTypeface(
                Typeface.DEFAULT,
                Typeface.BOLD
        );

        root.addView(logo);

        // TITLE

        TextView title =
                text(
                        "Your Music.\nYour Global Stage.",
                        29,
                        TEXT
                );

        title.setTypeface(
                Typeface.DEFAULT,
                Typeface.BOLD
        );

        title.setPadding(
                0,
                24,
                0,
                8
        );

        root.addView(title);

        // DESCRIPTION

        root.addView(
                subtitle(
                        "One powerful workspace for your music business."
                )
        );

        // SPACE

        Space space =
                new Space(this);

        root.addView(
                space,
                new LinearLayout.LayoutParams(
                        1,
                        80
                )
        );

        // EMAIL

        EditText email =
                input("Email");

        root.addView(email);

        // PASSWORD

        EditText password =
                input("Password");

        password.setInputType(0x81);

        root.addView(password);

        // SIGN IN

        Button signIn =
                button(
                        "SIGN IN  →",
                        PURPLE
                );

        root.addView(
                signIn,
                new LinearLayout.LayoutParams(
                        -1,
                        60
                )
        );

        // CREATE ACCOUNT

        Button create =
                button(
                        "CREATE ARTIST ACCOUNT",
                        SURFACE_2
                );

        root.addView(
                create,
                new LinearLayout.LayoutParams(
                        -1,
                        60
                )
        );

        // FOOTER

        root.addView(
                subtitle(
                        "Secure • Global Distribution • Royalty Management"
                )
        );

        // LOGIN ACTION

        signIn.setOnClickListener(
                v -> {

                    String mail =
                            email.getText()
                                    .toString()
                                    .trim();

                    String pass =
                            password.getText()
                                    .toString();

                    if (
                            mail.contains("@")
                                    &&
                            pass.length() >= 6
                    ) {

                        home();

                    } else {

                        Toast.makeText(
                                this,
                                "Valid email and 6+ character password required",
                                Toast.LENGTH_SHORT
                        ).show();
                    }
                }
        );

        // CREATE ACCOUNT

        create.setOnClickListener(
                v -> {

                    Toast.makeText(
                            this,
                            "Artist account creation will be connected to the AVESON backend.",
                            Toast.LENGTH_LONG
                    ).show();
                }
        );
    }


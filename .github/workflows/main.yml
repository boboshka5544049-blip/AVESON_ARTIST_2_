        view.setTypeface(
                Typeface.DEFAULT,
                Typeface.BOLD
        );

        view.setPadding(
                0,
                8,
                0,
                10
        );

        return view;
    }

    // ============================================================
    // SUBTITLE
    // ============================================================

    private TextView subtitle(String value) {

        TextView view = text(
                value,
                15,
                MUTED
        );

        view.setPadding(
                0,
                0,
                0,
                16
        );

        return view;
    }

    // ============================================================
    // SCREEN BASE
    // ============================================================

    private void base(
            LinearLayout page,
            boolean showBack
    ) {

        root = new LinearLayout(this);

        root.setOrientation(
                LinearLayout.VERTICAL
        );

        root.setBackgroundColor(BG);

        setContentView(root);

        // BACK BAR
        if (showBack) {

            LinearLayout bar =
                    new LinearLayout(this);

            bar.setGravity(
                    Gravity.CENTER_VERTICAL
            );

            TextView back =
                    text(
                            "‹",
                            40,
                            TEXT
                    );

            back.setGravity(
                    Gravity.CENTER
            );

            back.setOnClickListener(
                    v -> home()
            );

            bar.addView(
                    back,
                    new LinearLayout.LayoutParams(
                            55,
                            65
                    )
            );

            TextView logo =
                    text(
                            "AVESON",
                            20,
                            TEXT
                    );

            logo.setTypeface(
                    Typeface.DEFAULT,
                    Typeface.BOLD
            );

            bar.addView(logo);

            root.addView(bar);
        }

        root.addView(
                page,
                new LinearLayout.LayoutParams(
                        -1,
                        0,
                        1
                )
        );
    }


    // ============================================================
    // NEW RELEASE
    // ============================================================

    private void newRelease() {

        LinearLayout page =
                column();

        base(
                page,
                true
        );

        page.addView(
                header("New Release")
        );

        page.addView(
                subtitle(
                        "Build your release and submit it for AVESON review."
                )
        );

        // RELEASE TITLE

        page.addView(
                input("Release title")
        );

        // PRIMARY ARTIST

        page.addView(
                input("Primary artist")
        );

        // FEATURING

        page.addView(
                input("Featuring artist (optional)")
        );

        // GENRE

        page.addView(
                input("Genre")
        );

        // LANGUAGE

        page.addView(
                input("Language")
        );

        // RELEASE DATE

        LinearLayout dateRow =
                new LinearLayout(this);

        EditText releaseDate =
                input(
                        "Release date YYYY-MM-DD"
                );

        dateRow.addView(
                releaseDate,
                new LinearLayout.LayoutParams(
                        0,
                        58,
                        1
                )
        );

        Button calendar =
                button(
                        "📅",
                        SURFACE_2
                );

        dateRow.addView(
                calendar,
                new LinearLayout.LayoutParams(
                        64,
                        58
                )
        );

        page.addView(dateRow);

        page.addView(
                subtitle(
                        "Calendar or keyboard. Past dates are blocked."
                )
        );

        calendar.setOnClickListener(
                v -> {

                    Calendar current =
                            Calendar.getInstance();

                    DatePickerDialog picker =
                            new DatePickerDialog(
                                    this,
                                    (
                                            dialog,
                                            year,
                                            month,
                                            day
                                    ) -> {

                                        String value =
                                                String.format(
                                                        Locale.US,
                                                        "%04d-%02d-%02d",
                                                        year,
                                                        month + 1,
                                                        day
                                                );

                                        releaseDate.setText(
                                                value
                                        );
                                    },
                                    current.get(
                                            Calendar.YEAR
                                    ),
                                    current.get(
                                            Calendar.MONTH
                                    ),
                                    current.get(
                                            Calendar.DAY_OF_MONTH
                                    )
                            );

                    picker.getDatePicker()
                            .setMinDate(
                                    System.currentTimeMillis() - 1000
                            );

                    picker.show();
                }
        );

        // AUDIO

        Button audio =
                button(
                        "🎵  SELECT AUDIO",
                        SURFACE_2
                );

        page.addView(
                audio,
                new LinearLayout.LayoutParams(
                        -1,
                        58
                )
        );

        audio.setOnClickListener(
                v -> pickFile(
                        "audio/*",
                        10
                )
        );

        // COVER

        Button cover =
                button(
                        "🎨  SELECT COVER",
                        SURFACE_2
                );

        page.addView(
                cover,
                new LinearLayout.LayoutParams(
                        -1,
                        58
                )
        );

        cover.setOnClickListener(
                v -> pickFile(
                        "image/*",
                        11
                )
        );

        // LYRICS

        page.addView(
                input(
                        "Lyrics (optional)"
                )
        );

        // COPYRIGHT

        page.addView(
                input(
                        "Copyright / rights owner"
                )
        );

        // EXPLICIT

        CheckBox explicit =
                new CheckBox(this);

        explicit.setText(
                "Explicit content"
        );

        explicit.setTextColor(
                TEXT
        );

        page.addView(explicit);

        // FINAL REVIEW

        Button review =
                button(
                        "FINAL REVIEW  →",
                        PURPLE
                );

        page.addView(
                review,
                new LinearLayout.LayoutParams(
                        -1,
                        60
                )
        );

        review.setOnClickListener(
                v -> {

                    Toast.makeText(
                            this,
                            "Release saved in AVESON ARTIST 2.0 prototype",
                            Toast.LENGTH_LONG
                    ).show();
                }
        );

        nav(
                page,
                2
        );
    }

    // ============================================================
    // FILE PICKER
    // ============================================================

    private void pickFile(
            String type,
            int requestCode
    ) {

        Intent intent =
                new Intent(
                        Intent.ACTION_OPEN_DOCUMENT
                );

        intent.addCategory(
                Intent.CATEGORY_OPENABLE
        );

        intent.setType(type);

        startActivityForResult(
                intent,
                requestCode
        );
    }


    // ============================================================
    // CARD
    // ============================================================

    private void card(
            LinearLayout parent,
            String title,
            String value,
            int accent
    ) {

        LinearLayout card =
                new LinearLayout(this);

        card.setOrientation(
                LinearLayout.VERTICAL
        );

        card.setPadding(
                20,
                16,
                20,
                16
        );

        card.setBackground(
                background(
                        SURFACE,
                        36
                )
        );

        int height;

        if (value.length() > 20) {

            height = 132;

        } else {

            height = 108;
        }

        LinearLayout.LayoutParams params =
                new LinearLayout.LayoutParams(
                        -1,
                        height
                );

        params.setMargins(
                0,
                0,
                0,
                12
        );

        card.setLayoutParams(params);

        TextView titleView =
                text(
                        title,
                        13,
                        MUTED
                );

        titleView.setTypeface(
                Typeface.DEFAULT,
                Typeface.BOLD
        );

        card.addView(titleView);

        TextView valueView =
                text(
                        value,
                        27,
                        TEXT
                );

        valueView.setTypeface(
                Typeface.DEFAULT,
                Typeface.BOLD
        );

        card.addView(valueView);

        TextView open =
                text(
                        "OPEN →",
                        13,
                        accent
                );

        open.setTypeface(
                Typeface.DEFAULT,
                Typeface.BOLD
        );

        card.addView(open);

        parent.addView(card);
    }

    // ============================================================
    // BOTTOM NAVIGATION
    // ============================================================

    private void nav(
            LinearLayout page,
            int selected
    ) {

        Space space =
                new Space(this);

        page.addView(
                space,
                new LinearLayout.LayoutParams(
                        1,
                        0,
                        1
                )
        );

        LinearLayout navigation =
                new LinearLayout(this);

        navigation.setPadding(
                6,
                6,
                6,
                6
        );

        navigation.setBackground(
                background(
                        Color.rgb(10, 13, 27),
                        48
                )
        );

        String[] items = {
                "HOME",
                "MUSIC",
                "+",
                "ANALYTICS",
                "MORE"
        };

        for (int i = 0; i < items.length; i++) {

            final int index = i;

            Button navButton =
                    button(
                            items[i],
                            i == selected
                                    ? PURPLE
                                    : SURFACE_2
                    );

            navButton.setTextSize(
                    i == 2 ? 22 : 11
            );

            navigation.addView(
                    navButton,
                    new LinearLayout.LayoutParams(
                            0,
                            58,
                            1
                    )
            );

            navButton.setOnClickListener(
                    v -> {

                        if (index == 0) {

                            home();

                        } else if (index == 1) {

                            music();

                        } else if (index == 2) {

                            newRelease();

                        } else if (index == 3) {

                            analytics();

                        } else {

                            more();
                        }
                    }
            );
        }

        page.addView(navigation);
    }


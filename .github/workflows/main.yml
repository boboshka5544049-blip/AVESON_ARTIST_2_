    // =========================================================
    // DRAWABLES
    // =========================================================

    private GradientDrawable rounded(
            int color,
            int radius
    ) {

        GradientDrawable d =
                new GradientDrawable();

        d.setColor(color);

        d.setCornerRadius(radius);

        return d;
    }

    private GradientDrawable roundedStroke(
            int color,
            int stroke,
            int radius
    ) {

        GradientDrawable d =
                new GradientDrawable();

        d.setColor(color);

        d.setStroke(
                2,
                stroke
        );

        d.setCornerRadius(radius);

        return d;
    }

    private GradientDrawable gradientButton() {

        GradientDrawable d =
                new GradientDrawable(
                        GradientDrawable.Orientation.LEFT_RIGHT,
                        new int[]{
                                PURPLE,
                                BLUE
                        }
                );

        d.setCornerRadius(18);

        return d;
    }

    // =========================================================
    // LAYOUT PARAMS
    // =========================================================

    private LinearLayout.LayoutParams lp(
            int width,
            int height,
            int left,
            int top,
            int right,
            int bottom
    ) {

        LinearLayout.LayoutParams p =
                new LinearLayout.LayoutParams(
                        width,
                        height
                );

        p.setMargins(
                left,
                top,
                right,
                bottom
        );

        return p;
    }
